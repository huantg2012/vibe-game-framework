<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>生命大陆 · 承重局部 · 那天之后</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; background: #111519; color: #d4dbdf; font: 14px/1.6 system-ui, sans-serif; }
    #landmass-study { display: flex; height: 100vh; } #landmass-controls { width: 280px; flex: 0 0 280px; padding: 18px; overflow-y: auto; border-right: 1px solid #3b444b; }
    #landmass-controls h1 { font-size: 20px; margin: 0 0 12px; } #landmass-controls p { color: #aebbc3; } #landmass-controls a { color: #becfcf; } #landmass-controls label { display: block; margin: 10px 0; }
    #landmass-controls :is(select, input, button) { font: inherit; color: inherit; background: #202b33; border: 1px solid #53636e; padding: 7px; border-radius: 3px; }
    #landmass-controls :is(select, input) { display: block; width: 100%; } #landmass-controls button { cursor: pointer; margin: 4px 0; width: 100%; } #landmass-controls button:disabled { opacity: .45; cursor: default; }
    #game-container { position: relative; flex: 1; min-width: 0; display: flex; justify-content: center; align-items: center; background: #070a0b; overflow: hidden; outline: none; }
    #game-container canvas { display: block; } #landmass-controls #status { color: #d8dfca; } #landmass-controls #error { color: #efad9d; white-space: pre-wrap; }
    #landmass-controls pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 ui-monospace, monospace; }
  </style>
</head><body><main id="landmass-study">
  <aside id="landmass-controls">
    <h1>生命大陆 · 承重局部</h1>
    <p><a href="/world-study.html">世界方向图</a> · <a href="/build-lab.html">构筑对照场</a></p>
    <p>踩在另一种生命撑起的地貌上。先体验承重、牵拉与回落的完整局部；训练物品和记录隔离，不读写长期存档。</p>
    <label>局部编排<select id="scene"><option value="living-borne-fin">承重鳍面</option></select></label>
    <label>出击配置<select id="loadout"></select></label>
    <label>种子<input id="seed" type="number" min="0" max="4294967295" step="1" value="7" /></label>
    <p id="description"></p>
    <button id="start" disabled>开始 / 中止当前并重开</button>
    <button id="abort" disabled>中止本次</button><button id="pause" disabled>暂停 / 继续（Esc）</button>
    <button id="download">下载本页全部记录 JSON</button>
    <p id="route-description"></p>
    <p>右侧薄面中段的硬缘受压时会夹合。先看连接和折边，再决定等候、撬开卡结或沿左脊绕行。中央空腔可以望入，无法跨越。</p>
    <p>WASD 移动 / 转向 · 空格挥击<br>Q / F 使用已装配物件<br>E 按住翻找、在起点按 E 撤离<br>Tab 本趟拾获（世界继续）<br>结束后 R 返回本页配置</p>
    <p id="status">载入正式游戏资源…</p><details><summary>本次观测</summary><pre id="state"></pre></details><pre id="error" role="alert"></pre>
  </aside><div id="game-container" tabindex="0"></div>
</main><script type="module" src="/src/dev/living-landmass.ts"></script></body></html>
