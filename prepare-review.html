<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COH · 备行实景复核</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0b0d}
    #game-container{position:absolute;inset:48px 0 0;display:flex;align-items:center;justify-content:center}
    #prepare-review-controls{position:absolute;inset:0 0 auto;z-index:20000;padding:8px 12px;background:#151a1e;color:#c8cdd4;font:12px/24px sans-serif}
    #prepare-review-controls button{font:inherit;margin:0 4px;padding:0 7px;background:#242930;color:#c8cdd4;border:1px solid #454b52;cursor:pointer}
    #prepare-review-controls button[aria-pressed=true]{border-color:#a2aa96}
    #prepare-review-error{position:fixed;bottom:0;left:0;right:0;z-index:21000;white-space:pre-wrap;color:#dab6a3;background:#190f0e;font:12px/18px monospace}
  </style>
</head>
<body>
  <div id="prepare-review-controls">开发复核 · 内存示例，不读写正式存档</div>
  <div id="game-container"></div>
  <script>
    // Install before any imported module initializes locale or narration memory.
    // SaveManager also receives its own transactional memory backend in the entry.
    (() => {
      const values = new Map();
      const storage = {
        get length() { return values.size; },
        key(index) { return [...values.keys()][Number(index) >>> 0] ?? null; },
        getItem(key) { return values.get(String(key)) ?? null; },
        setItem(key, value) { values.set(String(key), String(value)); },
        removeItem(key) { values.delete(String(key)); },
        clear() { values.clear(); }
      };
      Object.defineProperty(window, 'localStorage', { configurable: true, value: storage });
    })();
  </script>
  <script type="module" src="/src/dev/prepare-review.ts"></script>
</body>
</html>
