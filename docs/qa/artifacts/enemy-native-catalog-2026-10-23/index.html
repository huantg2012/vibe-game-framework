<h1>它们曾经是什么</h1>
<p>基体保留自己的身体和运动，六种世界材料改变组织方式。每一类均并排展示渗透、改写、覆盖三个侵蚀阶段。地面模型显示四向；占漆与占空显示完整节律。</p>
<p class="status">共享正式绘制器的离线图册 · 使用真实世界地面色和统一灯光 · 不是实机截图或性能验收</p>
<p class="hint">目录有模型不等于当前三图已投放。现用有机残影／人形、菌毯／油膜、气团的遭遇配置保持不变；地图低／中／重污染与个体侵蚀阶段也不一一对应。三种占漆复用现有实现；余响保留原空间痕迹和节律，增加世界材料及受光。</p>
