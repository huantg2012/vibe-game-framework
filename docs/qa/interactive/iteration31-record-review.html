<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <title>COH · 迭代 31 存档保护验收</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0b0d; color: #c8cdd4; font: 12px/18px sans-serif; }
    #record-review-toolbar { position: absolute; top: 0; left: 0; right: 0; height: 152px; padding: 8px 12px; box-sizing: border-box; background: #151a1e; z-index: 20000; }
    #record-review-toolbar button { margin: 2px; padding: 3px 7px; font: inherit; color: #c8cdd4; background: #242930; border: 1px solid #454b52; cursor: pointer; }
    #record-review-toolbar button[aria-pressed="true"] { border-color: #d38b67; }
    #record-review-status { margin-top: 4px; color: #b5c9b0; }
    #record-review-toolbar details { position: absolute; right: 12px; top: 116px; background: #151a1e; border: 1px solid #454b52; padding: 3px 8px; max-width: 620px; z-index: 1; }
    #record-review-report { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 560px; overflow: auto; font: 11px/16px monospace; }
    #game-container { position: absolute; inset: 152px 0 0; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div id="record-review-toolbar">
    <div>DEV 验收 · 真实场景与 SaveManager · 记录只存在本页 Map 中，刷新即清空 · 不读取或删除正式游戏记录</div>

    <div id="record-review-status">启动中</div>
    <details><summary>记录状态 JSON</summary><pre id="record-review-report"></pre></details>
  </div>
  <div id="game-container"></div>
