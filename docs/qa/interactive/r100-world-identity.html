<script>
const worlds=[{"id":"ash-strata","label":"无彩层原"},{"id":"crystal-fibre","label":"晶化林床"},{"id":"ivory-basin","label":"吸光釉原"},{"id":"cinder-ridge","label":"余烬脊"},{"id":"pallid-membrane","label":"苍膜洼"},{"id":"silt-gel","label":"淤流前沿"},{"id":"schist-shear","label":"层片剪切带"},{"id":"splayed-fibres","label":"纤维扇流"},{"id":"shell-chain","label":"壳缘阶串"},{"id":"grain-laminate","label":"颗粒层片冲积"},{"id":"tension-membrane","label":"纤维牵膜"},{"id":"shell-gel-delta","label":"壳挡凝胶"},{"id":"pressed-dunes","label":"压实脊廊"},{"id":"ruptured-film","label":"破膜盆地"},{"id":"reversed-flow","label":"凝胶逆卷"},{"id":"laminate-shell","label":"层片包壳"},{"id":"fibre-silt","label":"纤维积沙槽"},{"id":"film-laminate","label":"膜覆层片"},{"id":"gel-fibre","label":"凝胶裹纤维"},{"id":"shell-grit","label":"断壳颗粒堤"}];const sel=document.querySelector('#world'),frame=document.querySelector('#frame');let at=0;
const initial=new URLSearchParams(location.search).get('world');if(worlds.some(w=>w.id===initial))at=worlds.findIndex(w=>w.id===initial);
const source=(side,id,kind)=>'../artifacts/r100-world-identity/'+side+'/'+id+'-medium-'+kind+'.png';
worlds.forEach((w,i)=>{const op=new Option(w.label,w.id);sel.add(op);const b=document.createElement('button');b.className='card';b.innerHTML='<img loading="lazy" alt=""><span></span>';b.querySelector('img').src=source('after',w.id,'walk');b.querySelector('span').textContent=w.label;b.onclick=()=>{at=i;sync();};document.querySelector('#catalog').append(b);});
function sync(){const w=worlds[at];sel.value=w.id;history.replaceState(null,'','?world='+encodeURIComponent(w.id));for(const side of ['before','after']){const img=document.querySelector('#'+side);img.hidden=false;img.nextElementSibling.hidden=true;img.onerror=()=>{img.hidden=true;img.nextElementSibling.hidden=false;};img.src=source(side,w.id,frame.value);}document.querySelector('#play').href='../../../r100-gym.html?world='+encodeURIComponent(w.id)+'&grade=medium&seed=20261005';document.querySelector('#position').textContent=(at+1)+' / '+worlds.length;document.querySelectorAll('.card').forEach((b,i)=>b.setAttribute('aria-current',i===at));}
const move=by=>{at=(at+by+worlds.length)%worlds.length;sync();};sel.onchange=()=>{at=worlds.findIndex(w=>w.id===sel.value);sync();};frame.onchange=sync;document.querySelector('#previous').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#zoom').onclick=()=>document.body.classList.toggle('zoom');document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);});sync();
</script></html>
