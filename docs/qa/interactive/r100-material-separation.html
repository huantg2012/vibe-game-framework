<h1>让实体拥有自己的材料</h1><p>地面是松散、磨碎的材料；障碍物保留致密表皮，并在断口露出内部。保留同一种世界材料的来源，让整块体积与脚下道路分开。</p>
<div class="controls"><select id="case" aria-label="选择对照对象"><option value="folded-slab-low-south" >折板 · 低污染</option><option value="folded-slab-medium-south" selected>折板 · 中污染</option><option value="folded-slab-medium-south-east" >折板 · 中污染 · 右下斜照</option><option value="folded-slab-medium-south-west" >折板 · 中污染 · 左下斜照</option><option value="folded-slab-severe-south" >折板 · 重污染</option><option value="fibre-knot-low-south" >纤维 · 低污染</option><option value="fibre-knot-medium-south" >纤维 · 中污染</option><option value="fibre-knot-severe-south" >纤维 · 重污染</option><option value="broken-shell-low-south" >壳体 · 低污染</option><option value="broken-shell-medium-south" >壳体 · 中污染</option><option value="broken-shell-severe-south" >壳体 · 重污染</option></select><button data-mode="before" aria-pressed="false">修前</button><button data-mode="after" aria-pressed="true">修后</button><button data-mode="wipe" aria-pressed="false">拖动对照</button><input id="wipe" aria-label="修前修后分界" type="range" min="0" max="100" value="50" hidden></div>

<div class="viewport"><div id="stage"><img id="new" alt="重构后的真实游戏画面"><img id="old" alt="重构前的真实游戏画面" hidden><div id="line" hidden></div></div></div><div id="note" class="caption">当前显示修后。可切换修前，或拖动分界直接对照。</div>
<footer><a href="../artifacts/r100-material-separation/final/index.html">实际走近与接触画面</a> · <a href="../r100-material-separation.md">检查记录与范围</a> · <a href="../../art/rift-r100-material-separation.md">材质设计</a><p>同一位置、几何、视野与肩灯设置；污染光和旁白仍按原生时间变化。图中没有后期提亮。13次局部真实接近，不代表完整地图或全部种子验收。此页是审查工具，不改变游戏操作。</p></footer>
<script>
const $=id=>document.getElementById(id),base='../artifacts/r100-material-separation/';let mode='after';
function update(){const id=$('case').value;$('new').src=base+'final/'+id+'-approach.png';$('old').src=base+'before/'+id+'-approach.png';const family=id.startsWith('folded')?'folded-slab':id.startsWith('fibre')?'fibre-knot':'broken-shell',grade=id.includes('-severe-')?'severe':id.includes('-medium-')?'medium':'low';$('play').href='/rift-r100-masters.html?family='+family+'&grade='+grade+'&seed=20261002';$('material').textContent=family==='folded-slab'?'连续层皮 / 层状断面 / 松散地床':family==='fibre-knot'?'融合矿物束 / 断裂束端 / 碎屑地床':'连续釉皮 / 暗哑内层 / 磨损地床';apply();}
function apply(){document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));$('old').hidden=mode==='after';$('wipe').hidden=$('line').hidden=mode!=='wipe';const at=mode==='before'?100:Number($('wipe').value);$('old').style.clipPath='inset(0 '+(100-at)+'% 0 0)';$('line').style.left=at+'%';$('note').textContent=mode==='wipe'?'左侧修前，右侧修后。拖动滑杆。':mode==='before'?'当前显示修前。':'当前显示修后。';}
$('case').onchange=update;$('wipe').oninput=apply;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;apply()});update();
</script></main></html>
