<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>裂隙 · 视野样片</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/src/dev/rift-vision-study.css"></head>
<body><main><header><div><p class="kicker">RIFT / VISION STUDY 01</p><h1>光的尽头</h1></div><p>照明交给世界，污染留在感知里。<br><span class="muted">真实场景动态样片 · 正式游戏暂未切换</span></p></header>
<div class="toolbar"><label>世界 <select id="world"><option value="crystal-fibre">晶化林床</option><option value="cinder-ridge">余烬脊</option><option value="ruptured-film">破膜盆地</option></select></label><div class="switch"><button id="new" aria-pressed="true">新表现</button><button id="old" aria-pressed="false">当前正式表现</button></div><button id="pause">暂停画面</button><button id="restart">回到出生点</button></div>
<div id="stage"><div id="game-container" tabindex="0" aria-label="真实裂隙场景，WASD移动，空格挥击"></div><div id="waiting" role="status">正在准备真实世界…</div></div>
<div class="controls"><div class="presets"><button data-p="0" data-a="0">初入裂隙</button><button data-p="100" data-a="0">污染饱和</button><button data-p="100" data-a="80">适应之后</button></div><label>污染 <input id="pollution" type="range" min="0" max="100" value="70"><output id="p-value">70</output></label><label>同化 <input id="assimilation" type="range" min="0" max="100" value="0"><output id="a-value">0%</output></label></div>
<footer><p id="status">准备中</p><p class="muted">点击场景后 WASD 行走／转向 · Space 挥击 · Esc 暂停（继续后可调参数）。可切回旧表现比较同一位置；拖动参数仅改变视野样本，不修改角色成长或正式存档。</p><p class="muted">此页隐藏战况HUD以观察画面。地图、材质、角色、危险与遮视均复用游戏；战斗数值仍按原规则，不用于平衡试玩。</p><p id="error" role="alert" hidden></p></footer></main><script type="module" src="/src/dev/rift-vision-study.ts"></script></body></html>
