<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光的尽头 · 吞光美术打版</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/src/dev/rift-light-eater-study.css"></head>
<body><main><header><div><p class="kicker">RIFT / LIGHT-EATING STUDY</p><h1>光的尽头</h1></div><p class="scope">动态美术打版 · 使用真实地图、材质与角色<br>独立内存会话 · 未接入正式流程</p></header>
<div class="toolbar"><label>世界 <select id="world"><option value="crystal-fibre">晶化林床</option><option value="cinder-ridge">余烬脊</option><option value="ruptured-film">破膜盆地</option></select></label><div class="switch"><button id="new" aria-pressed="true">吞光打版</button><button id="old" aria-pressed="false">正式旧版</button></div><button id="pause">暂停画面</button><button id="restart">回到出生点</button></div>
<div id="stage"><div id="game-container" tabindex="0" aria-label="裂隙美术观察场景，WASD移动"></div><div id="waiting" role="status">正在准备真实世界…</div></div>
<div class="controls"><div class="presets"><button data-p="15" data-a="0">初入裂隙<small>污染 15 · 同化 0</small></button><button data-p="55" data-a="0">侵蚀加深<small>污染 55 · 同化 0</small></button><button data-p="100" data-a="0">污染饱和<small>污染 100 · 同化 0</small></button><button data-p="100" data-a="80">适应之后<small>污染 100 · 同化 80</small></button></div><div class="sliders"><label>污染 <input id="pollution" type="range" min="0" max="100" value="0"><output id="p-value">0</output></label><label>同化 <input id="assimilation" type="range" min="0" max="100" value="0"><output id="a-value">0%</output></label><button id="auto" aria-pressed="false">连续演示</button></div></div>
<footer><div class="footline"><p id="description"></p><p id="status">准备中</p></div><p>点击场景后 WASD 移动／转身，Space 挥击，Esc 暂停。默认慢速往返扫描全部污染值，再演示同化扩距；也可拖动滑杆或点击端点。暂停时一并冻结光场与参数。下方读数仅供美术比较。</p><p>此页不用于战斗、数值或最终搜索难度验收，不读写正式存档。肩灯、材质与空间空洞来自游戏实景。</p><p id="error" role="alert" hidden></p></footer></main><script type="module" src="/src/dev/rift-light-eater-study.ts"></script></body></html>
