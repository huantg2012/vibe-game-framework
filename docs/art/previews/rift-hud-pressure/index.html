<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>右上角 HUD · 文字读数样例</title>
  <link rel="stylesheet" href="./study.css">
</head>
<body>
  <main>
    <header><p class="eyebrow">COH / HUD ART STUDY</p><h1>负重与同化</h1><p>文字读数，低饱和色移与紧凑对齐。仅美术样例，未接入游戏。</p></header>
    <nav aria-label="观察状态">
      <button data-preset="0">轻载 · 未同化</button>
      <button data-preset="1" class="selected">临满 · 中度同化</button>
      <button data-preset="2">满载 · 同化上限</button>
    </nav>
    <div class="scene" id="scene"><img src="./scene.png" alt="当前裂隙真实场景参考" width="960" height="640"><canvas id="hud" width="112" height="52" aria-label="薪柴、负重与同化文字读数样例"></canvas></div>
    <div class="controls">
      <label>负重 <input id="weight" type="range" min="0" max="16" value="14" step="0.1"><output id="weight-value">14.0 / 16.0</output></label>
      <label>同化 <input id="assimilation" type="range" min="0" max="100" value="60" step="1"><output id="assimilation-value">60.0%</output></label>
    </div>
    <p class="caption">上图为 960 × 640 实景原尺寸。负重与同化可独立调整；仅改变预览读数，不运行机制。</p>
    <section><div class="section-heading"><h2>右上角细看</h2><span>三种状态 · 2× 最近邻</span></div><canvas id="comparison" width="960" height="180"></canvas></section>
    <footer>负重从灰白逐渐偏向赭金；同化从灰白逐渐染上铁锈红，不设置跳色档位。<br>图标方向已停止；100%是同化上限，不表示死亡。</footer>
  </main>
  <script type="module" src="./study.js"></script>
</body>
</html>
