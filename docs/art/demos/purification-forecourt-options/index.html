<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>核心前庭 · 三种空间方案</title>
  <link rel="stylesheet" href="./viewer.css" />
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">净化点 / 空间比较</p><h1>核心前庭</h1></div>
      <p class="method">同一镜头、材质与光照时刻 · 待选方案</p>
    </header>
    <nav class="toolbar" aria-label="方案比较">
      <div id="options" class="options" role="group" aria-label="选择方案"></div>
      <div class="tools">
        <button id="hold-current" disabled title="按住鼠标、空格或 Enter 查看当前版，松开返回方案">按住看当前版</button>
        <label><input id="compare" type="checkbox" disabled />划线对照</label>
        <label><input id="annotations" type="checkbox" disabled />构思标注</label>
      </div>
    </nav>
    <section class="comparison" aria-label="同尺度场景比较">
      <figure class="whole">
        <figcaption><span>整景</span><span id="whole-state" class="subtle">正在载入</span></figcaption>
        <div class="image-wrap"><canvas id="whole" width="960" height="640" aria-label="选中方案的完整场景"></canvas></div>
      </figure>
      <aside>
        <figure class="focus">
          <figcaption><span>核心前庭</span><span class="subtle">固定裁切 · 原像素</span></figcaption>
          <div class="image-wrap"><canvas id="focus" width="390" height="300" aria-label="选中方案右侧前庭的固定局部"></canvas></div>
        </figure>
        <div class="option-copy" aria-live="polite" aria-atomic="true">
          <h2 id="title">正在载入场景</h2>
          <p id="summary"></p>
          <p id="tradeoff"></p>
        </div>
      </aside>
    </section>
    <footer>
      <div id="swipe-control" class="swipe-control" hidden>
        <span>当前版</span><input id="split" type="range" min="0" max="100" value="50" aria-label="当前版与选中方案的分界位置" /><span id="split-name">方案 A</span>
      </div>
      <p id="legend" hidden><span class="legend-footprint">改动范围</span><span class="legend-route">进入路线</span><span class="legend-stop">停驻位置</span><span class="subtle">构思标注，尚未接入角色移动</span></p>
      <p id="status" role="status">正在读取四张同视角场景。</p>
    </footer>
  </main>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
