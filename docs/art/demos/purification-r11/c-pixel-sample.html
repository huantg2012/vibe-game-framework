<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C · 实际像素样板</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111315; color: #dfded7; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { width: 1008px; margin: 24px auto 36px; padding: 0 24px; }
      header { display: flex; align-items: baseline; justify-content: space-between; }
      h1 { margin: 0; font-size: 21px; font-weight: 550; }
      a { color: #a9aeaa; font-size: 13px; text-underline-offset: 3px; }
      p { margin: 10px 0 16px; color: #a4a8a3; font-size: 13px; line-height: 1.6; }
      .controls { display: flex; align-items: center; gap: 18px; margin: 10px 0; }
      .buttons { display: inline-flex; gap: 5px; }
      button { border: 1px solid #414643; border-radius: 3px; background: #202522; color: #c9cdc6; padding: 7px 11px; font: inherit; font-size: 13px; cursor: pointer; }
      button[aria-pressed="true"] { border-color: #b9baa9; background: #343b33; color: #fffdf0; }
      button:disabled { cursor: default; opacity: .4; }
      button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid #c5be9e; outline-offset: 3px; }
      label { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; }
      input { accent-color: #b9baa9; }
      #download-sample { margin-left: auto; }
      canvas { display: block; width: 960px; height: 640px; margin-top: 16px; background: #0b0d0e; image-rendering: pixelated; }
      #sample-status { margin: 9px 0 0; }
      #sample-status:empty { display: none; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>C · 实际像素样板</h1>
        <a href="./index.html">构图对照</a>
      </header>
      <p>本次实际像素绘制区域；其余为C空间参照，未接通行/视差。</p>
      <div class="controls">
        <div class="buttons" role="group" aria-label="照明与侵蚀状态">
          <button type="button" data-state="ambient" aria-pressed="false">普通照明</button>
          <button type="button" data-state="core" aria-pressed="true">核心受光</button>
          <button type="button" data-state="intrusion" aria-pressed="false">侵蚀变化</button>
        </div>
        <button id="download-sample" type="button" disabled>下载当前样板 PNG</button>
      </div>
      <div class="controls">
        <div class="buttons" role="group" aria-label="查看范围">
          <button type="button" data-view="crop" aria-pressed="true">局部 2×</button>
          <button type="button" data-view="full" aria-pressed="false">C 完整构图</button>
          <button type="button" data-view="original" aria-pressed="false">仅 C 原图</button>
        </div>
        <label><input id="show-player" type="checkbox" checked />原人物</label>
      </div>
      <canvas id="sample-canvas" width="960" height="640" aria-label="C 实际像素样板，局部两倍显示"></canvas>
      <p id="sample-status" role="status" aria-live="polite">正在载入。</p>
    </main>
    <script type="module" src="./pixel-sample/viewer.ts"></script>
  </body>
</html>
