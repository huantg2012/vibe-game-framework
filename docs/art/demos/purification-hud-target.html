<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>净化点 HUD 目标效果（层级修订）</title>
  <style>
    :root {
      --ui-text: #8a8f96;
      --ui-bright: #c8cdd4;
      --kindling: #c4873a;
      --tide: #1aad96;
      --shadow: 0 0 2px rgba(0, 0, 0, 0.8);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 960px; height: 640px; overflow: hidden; background: #080a0c; }
    body { font-family: "Courier New", Courier, monospace; }
    .stage {
      width: 960px;
      height: 640px;
      position: relative;
      background:
        radial-gradient(ellipse 70% 60% at 50% 48%, #0e4a3f 0%, transparent 55%),
        radial-gradient(ellipse 36% 32% at 62% 44%, #1a6b5c 0%, transparent 52%),
        linear-gradient(180deg, #0a0b0d 0%, #080a0c 42%, #0d1114 100%);
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(8, 10, 12, 0) 0px,
        rgba(8, 10, 12, 0) 2px,
        rgba(0, 0, 0, 0.18) 2px,
        rgba(0, 0, 0, 0.18) 3px
      );
      pointer-events: none;
    }
    .ring {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 420px;
      height: 420px;
      margin: -210px 0 0 -210px;
      border: 1px solid rgba(26, 173, 150, 0.18);
      border-radius: 50%;
    }
    .core-dot {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      background: #c8cdd4;
      opacity: 0.35;
    }

    /* Three meters, not one table. Internally = rift chaos: label+value, caption under value. */
    .hud {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
      z-index: 2;
    }
    .meter {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 4px;
      text-shadow: var(--shadow);
    }
    .label {
      font-size: 12px;
      color: var(--ui-text);
      padding-top: 2px;
    }
    .stack {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
    }
    .value {
      font-size: 13px;
      font-weight: bold;
      line-height: 1.15;
    }
    .cap {
      font-size: 12px;
      color: var(--ui-text);
      font-weight: normal;
      line-height: 1.2;
    }
    .kindling { color: var(--kindling); font-size: 14px; }
    .tide { color: var(--tide); }
    .core { color: var(--ui-bright); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="ring"></div>
    <div class="core-dot"></div>
    <div class="hud">
      <div class="meter">
        <span class="label">薪柴</span>
        <span class="value kindling">11</span>
      </div>
      <div class="meter">
        <span class="label">潮汐</span>
        <div class="stack">
          <span class="value tide">第 1 潮</span>
          <span class="cap">涨潮</span>
        </div>
      </div>
      <div class="meter">
        <span class="label">下次归来</span>
        <div class="stack">
          <span class="value core">核心</span>
          <span class="cap">中等</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
