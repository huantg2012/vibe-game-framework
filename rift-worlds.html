<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>裂隙图志 · 世界生成样板</title>
    <style>
      :root { color-scheme: dark; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #dfdfd8; background: #101216; }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100dvh; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
      button, input, select { font: inherit; }
      button, select { color: inherit; background: none; border: 1px solid #35373b; cursor: pointer; border-radius: 3px; }
      button:hover, select:hover { border-color: #989990; }
      button:focus-visible, select:focus-visible, input:focus-visible, canvas:focus-visible { outline: 2px solid #cacabc; outline-offset: 3px; }
      button:disabled { opacity: .4; cursor: wait; }
      header { padding: 15px 24px 13px; border-bottom: 1px solid #2b2e34; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
      .identity { min-width: 156px; display: flex; gap: 10px; align-items: baseline; }
      .identity strong { font-size: 17px; letter-spacing: .18em; font-weight: 500; }
      .identity span { color: #787c84; font: 10px ui-monospace, monospace; letter-spacing: .08em; }
      nav { display: flex; gap: 4px; flex: 1; }
      nav button { min-width: 102px; padding: 8px 14px; border-color: transparent; font-size: 13px; color: #989da5; }
      nav button[aria-pressed="true"] { border-color: #626568; color: #eeeeea; background: #24272b; }
      .generation { display: flex; gap: 10px; align-items: center; font-size: 12px; }
      select { padding: 7px 9px; background: #171a1f; }
      #seed { width: 90px; padding: 7px 8px; color: #aeb1b7; border: 1px solid #34373d; border-radius: 3px; background: #171a1f; font-family: ui-monospace, monospace; }
      #regenerate { padding: 7px 12px; }
      main { min-height: 0; position: relative; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: grab; touch-action: none; outline: none; }
      canvas:active { cursor: grabbing; }
      .caption { pointer-events: none; position: absolute; left: 28px; top: 23px; max-width: 360px; text-shadow: 0 1px 3px #000; }
      .caption .eyebrow { font: 10px ui-monospace, monospace; letter-spacing: .16em; color: #868d99; margin-bottom: 7px; }
      .caption h1 { font-size: 23px; font-weight: 400; letter-spacing: .14em; margin: 0 0 8px; }
      .caption p { font-size: 12px; color: #a8a9ab; line-height: 1.8; margin: 0; max-width: 330px; }
      .view-actions { position: absolute; right: 22px; top: 22px; display: flex; gap: 6px; }
      .view-actions button { padding: 8px 12px; background: #14171de8; color: #b9bcc1; font-size: 12px; }
      .view-actions button[aria-pressed="true"] { color: #eee; border-color: #959890; }
      #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #101216d9; font-size: 13px; letter-spacing: .12em; }
      #loading[hidden] { display: none; }
      #error { position: absolute; bottom: 28px; left: 28px; right: 28px; padding: 18px; background: #382322; border: 1px solid #956b66; color: #f2d9d7; white-space: pre-wrap; max-height: 40%; overflow: auto; }
      #error[hidden] { display: none; }
      footer { display: flex; gap: 20px; justify-content: space-between; align-items: center; padding: 11px 24px; border-top: 1px solid #2b2e34; font-size: 11px; color: #828790; }
      footer .help { display: flex; gap: 17px; flex-wrap: wrap; }
      kbd { font: 10px ui-monospace, monospace; color: #c4c6c8; margin-right: 4px; }
      #position { font-family: ui-monospace, monospace; white-space: nowrap; color: #a1a5ac; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    </style>
  </head>
  <body>
    <header>
      <div class="identity"><strong>裂隙图志</strong><span>STUDY 01</span></div>
      <nav aria-label="世界配方">
        <button data-world="ash-strata" aria-pressed="false">无彩层原</button>
        <button data-world="crystal-fibre" aria-pressed="true">晶化林床</button>
        <button data-world="ivory-basin" aria-pressed="false">吸光釉原</button>
      </nav>
      <div class="generation">
        <label class="sr-only" for="topology">路线结构</label>
        <select id="topology"><option value="loops">回环地貌</option><option value="channels">长带重汇</option></select>
        <label class="sr-only" for="seed">地图种子</label>
        <input id="seed" type="text" inputmode="numeric" value="70421" maxlength="10" spellcheck="false" aria-label="地图种子" />
        <button id="regenerate">换一张 <kbd>R</kbd></button>
      </div>
    </header>
    <main>
      <canvas id="world" tabindex="0" aria-label="可移动地图。WASD移动，滚轮缩放，拖拽观察，空格回到角色。"></canvas>
      <div class="caption"><div class="eyebrow" id="world-code">RIFT / 02</div><h1 id="world-name">晶化林床</h1><p id="world-description">纤维曾经柔软，如今沿陌生的方向凝结。</p></div>
      <div class="view-actions"><button id="overview" aria-pressed="true">全图</button><button id="walk" aria-pressed="false">步行</button><button id="field" aria-pressed="false">视野</button></div>
      <div id="loading" role="status">正在生成世界</div>
      <pre id="error" role="alert" hidden></pre>
    </main>
    <footer>
      <div class="help"><span><kbd>WASD</kbd>移动</span><span>拖拽观察 · 滚轮缩放</span><span><kbd>Space</kbd>回到角色</span><span><kbd>1 / 2 / 3</kbd>切世界</span><span>同种子保留路线</span></div>
      <span id="position">生成样板 · 可步行</span>
    </footer>
    <script type="module" src="/src/dev/world-study.ts"></script>
  </body>
</html>
