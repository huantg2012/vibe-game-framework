<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COH · UI 实机验收</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: #0a0b0d; overflow: hidden; }
      #game-container { position: absolute; inset: 88px 0 0; display: flex; align-items: center; justify-content: center; }
      #review-controls { position: absolute; inset: 0 0 auto; z-index: 20000; padding: 8px 12px; background: #151a1e; color: #c8cdd4; font: 13px/22px sans-serif; }
      #review-controls button { background: #242930; border: 1px solid #454b52; border-radius: 0; color: #c8cdd4; font: inherit; padding: 2px 5px; margin: 2px; cursor: pointer; }
      #review-controls button[aria-pressed="true"] { border-color: #c4873a; }
      body.core-sample #game-container { top: 52px; }
      #review-note { color: #8a8f96; margin-left: 8px; }
    </style>
  </head>
  <body>
    <div id="review-controls">正在载入生产场景…</div>
    <div id="game-container"></div>
    <script type="module" src="/src/dev/ui-review.ts"></script>
  </body>
</html>
