<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>构筑与遭遇对照场 · 那天之后</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; background: #111519; color: #d4dbdf; font: 14px/1.6 system-ui, sans-serif; }
    main { display: flex; height: 100vh; } aside { width: 300px; flex: 0 0 300px; padding: 18px; overflow-y: auto; border-right: 1px solid #3b444b; }
    h1 { font-size: 20px; margin: 0 0 12px; } p { color: #aebbc3; } label { display: block; margin: 10px 0; }
    select, input, button { font: inherit; color: inherit; background: #202b33; border: 1px solid #53636e; padding: 7px; border-radius: 3px; }
    select, input { display: block; width: 100%; } button { cursor: pointer; margin: 4px 0; width: 100%; } button:disabled { opacity: .45; cursor: default; }
    #game-container { position: relative; flex: 1; min-width: 0; display: flex; justify-content: center; align-items: center; background: #070a0b; overflow: hidden; }
    #game-container canvas { display: block; } #status { color: #d8dfca; } #error { color: #efad9d; white-space: pre-wrap; } pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 ui-monospace, monospace; }
  </style>
</head>
<body><main>
  <aside>
    <h1>构筑与遭遇对照场</h1>
    <p><a href="/world-study.html" style="color:inherit">查看三个异时空世界方向 →</a></p>
    <p>隔离训练库存。刷新即清空，不读写正式纪录。此处不代表持续供给验收。</p>
    <label>遭遇<select id="encounter"></select></label>
    <label>装配<select id="loadout"></select></label>
    <label>种子<input id="seed" type="number" min="0" max="4294967295" step="1" value="7" /></label>
    <label>周期实体<select id="volume"><option value="gas_mass">气团</option><option value="mist_bank">雾团</option><option value="dust_swarm">尘絮群</option></select></label>
    <p id="description"></p>
    <button id="start" disabled>开始 / 中止当前并重开</button>
    <button id="abort" disabled>中止本次试验</button>
    <button id="pause" disabled>暂停 / 继续（Esc）</button>
    <button id="download">下载本页全部记录 JSON</button>
    <p>WASD 移动 / 转向 · 空格挥击<br>Q / F 主动技能 · E 按住翻找与撤离<br>Tab 本趟拾获（世界继续）<br>结束后 R 返回本页配置</p>
    <p id="status">载入正式游戏资源…</p>
    <pre id="state"></pre><pre id="error" role="alert"></pre>
  </aside>
  <div id="game-container" tabindex="0"></div>
</main><script type="module" src="/src/dev/build-lab.ts"></script></body>
</html>
