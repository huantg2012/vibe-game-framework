<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随身物件 · 独立验收</title>
<style>html,body{margin:0;min-height:100%;background:#1a211d;color:#a0aa96;font:12px/20px "PingFang SC","Microsoft YaHei",sans-serif}#review-controls{position:absolute;top:30px;left:20px;width:216px}#review-controls h1{font-size:15px;font-weight:400;line-height:24px;margin:0 0 14px}#review-controls p{font-size:11px;line-height:19px;margin:9px 0;color:#879580}#review-controls button{display:block;margin:9px 0;padding:6px 9px;background:#222d23;color:#b9bca7;border:1px solid #536149;font:11px/17px inherit;cursor:pointer}#review-state{font-size:10px;white-space:pre-wrap;overflow-wrap:anywhere;color:#92a287;margin-top:20px}#review-log{font-size:10px;line-height:17px;white-space:pre-wrap;overflow-wrap:anywhere;color:#adac91}#dom-ui-root{position:absolute!important;top:0!important;left:0!important}#review-warning{color:#b7a889!important}</style>
</head><body><main id="review-controls"><h1>随身物件 · 独立验收</h1><p id="review-warning">只使用测试物件。<br>不读取、写入或迁移游戏存档。</p><button id="review-base">净化点 · 60 件混合留存</button><button id="review-prepare">备行 · 出发前装配</button><button id="review-rift">裂隙 · 满载附近交换</button><button id="review-refresh">无变化刷新</button><button id="review-fail">下次操作模拟失败</button><button id="review-empty">空白列表</button><p>窗口尺度为真实 960 × 640。<br>左侧仅为测试控制，不是假场景。<br>↑↓ / Tab / Space / Enter<br>B / Esc 收起，模式按钮重新打开。</p><pre id="review-state"></pre><pre id="review-log" aria-live="polite"></pre></main><script type="module" src="./view-review.ts"></script></body></html>
